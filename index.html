<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Chunky, high-contrast British Racing Green & Gold personal dialer for flip phones.">
  <meta name="theme-color" content="#020d07">
  <title>FlipDialler Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-container">

    <!-- 1. Ambient Micro Telemetry HUD -->
    <header class="hud-bar" role="banner">
      <div class="hud-left">
        <span class="hud-gold-emblem">✦</span>
        <span id="activeScreenTitle" class="hud-title">FRESH</span>
      </div>
      <div class="hud-right">
        <div class="hud-pill" title="Daily calls">
          <span class="hud-icon">🔥</span>
          <span id="hudCallCount">0/10</span>
        </div>
        <div class="hud-pill" title="Callbacks due">
          <span class="hud-dot-warning"></span>
          <span id="hudDueCount">0 Due</span>
        </div>
      </div>
    </header>

    <!-- 2. Main Viewport -->
    <main class="app-viewport" id="appViewport">

      <!-- ================= SCREEN: CONTACTS LIST ================= -->
      <section id="screenContacts" class="screen-view active">
        <!-- Pipeline Stage Ribbon -->
        <div class="stage-ribbon" role="tablist">
          <button class="stage-tab active" data-queue="uncontacted" role="tab">
            <span class="key-badge">7</span> Fresh (<span id="countUncontacted">0</span>)
          </button>
          <button class="stage-tab" data-queue="callback" role="tab">
            <span class="key-badge">8</span> Call Back (<span id="countCallback">0</span>)
          </button>
          <button class="stage-tab" data-queue="contacted" role="tab">
            <span class="key-badge">9</span> Contacted (<span id="countContacted">0</span>)
          </button>
          <button class="stage-tab" data-queue="all" role="tab">
            All
          </button>
        </div>

        <!-- Search Bar -->
        <div class="search-bubble">
          <span class="search-icon">🔍</span>
          <input type="search" id="searchInput" placeholder="Search... [Key 5 or *]" autocomplete="off">
          <button id="btnClearSearch" class="btn-clear hidden">&times;</button>
        </div>

        <!-- Chunky Contact Cards List -->
        <div id="contactList" class="bento-card-list" role="list"></div>
      </section>

      <!-- ================= SCREEN: CALL COCKPIT (PROFILE) ================= -->
      <section id="screenProfile" class="screen-view hidden">
        <div id="profileCockpit" class="cockpit-container">
          <!-- Injected via tmpl-cockpit -->
        </div>
      </section>

      <!-- ================= SCREEN: LOGS ================= -->
      <section id="screenHistory" class="screen-view hidden">
        <div class="section-title-strip">
          <h2>Audit &amp; Interaction Logs</h2>
        </div>
        <div id="globalHistoryList" class="history-card-list"></div>
      </section>

      <!-- ================= SCREEN: SETTINGS & TEMPLATES ================= -->
      <section id="screenSettings" class="screen-view hidden">
        <div class="bento-box">
          <h3 class="bento-box-title">Daily Call Target</h3>
          <div class="flex-row">
            <input type="number" id="inputDailyCallTarget" min="1" max="150" class="chunky-input" value="10">
            <button id="btnSaveTarget" class="btn btn-gold btn-sm">Save</button>
          </div>
        </div>

        <div class="bento-box">
          <h3 class="bento-box-title">Import Leads CSV</h3>
          <input type="file" id="fileCsvInput" accept=".csv,text/csv,text/plain" class="hidden-input">
          <label for="fileCsvInput" class="btn btn-gold btn-block">
            <span class="key-badge">#</span> Select CSV File
          </label>
        </div>

        <div class="bento-box">
          <h3 class="bento-box-title">Active Email Templates</h3>
          <div class="form-group">
            <label for="templateSelector">Choose Template to Edit</label>
            <select id="templateSelector" class="chunky-input"></select>
          </div>
          <div class="form-group">
            <label for="templateSubject">Subject</label>
            <input type="text" id="templateSubject" class="chunky-input">
          </div>
          <div class="form-group">
            <label for="templateBody">Body</label>
            <textarea id="templateBody" class="chunky-input" rows="4"></textarea>
          </div>
          <button id="btnSaveTemplate" class="btn btn-gold btn-sm">Save Template</button>
        </div>

        <div class="bento-box">
          <h3 class="bento-box-title">Data Management</h3>
          <div class="btn-stack">
            <button id="btnExportCsv" class="btn btn-subtle btn-sm">Export Contacts CSV</button>
            <button id="btnExportJson" class="btn btn-subtle btn-sm">Export Full Backup (JSON)</button>
            <label for="fileJsonRestore" class="btn btn-subtle btn-sm text-center">Restore JSON</label>
            <input type="file" id="fileJsonRestore" accept=".json,application/json" class="hidden-input">
          </div>
        </div>

        <div class="bento-box danger-box">
          <button id="btnClearAllData" class="btn btn-danger btn-block">Purge All Database Leads</button>
        </div>
      </section>
    </main>

    <!-- 3. Permanent Non-Overlapping Bottom Dock -->
    <footer class="app-dock">
      <div id="dockDefaultView" class="dock-row">
        <button class="dock-item active" data-screen="screenContacts">
          <span class="d-key">0</span> Leads
        </button>
        <button class="dock-item" data-screen="screenHistory">
          <span class="d-key">4</span> Logs
        </button>
        <button class="dock-item" data-screen="screenSettings">
          <span class="d-key">6</span> Setup
        </button>
      </div>

      <!-- Quick Context Profile Bar -->
      <div id="dockProfileView" class="dock-row hidden">
        <button id="btnDockBack" class="dock-action-btn dock-back">
          <span class="d-key">0</span> Back
        </button>
        <button id="btnDockEdit" class="dock-action-btn dock-edit">
          <span class="d-key">6</span> Edit Details
        </button>
      </div>
    </footer>

    <!-- ================= MODALS & DRAWERS ================= -->

    <!-- Quick Call-Back Scheduler Drawer -->
    <div id="modalScheduleCallback" class="modal-sheet-backdrop hidden">
      <div class="modal-sheet">
        <div class="sheet-head">
          <h3>Set Call Back Time</h3>
          <button id="btnCloseCallbackSheet" class="btn-clear">&times;</button>
        </div>
        <div class="sheet-body">
          <div class="quick-choice-grid">
            <button class="btn btn-choice" data-hours="2"><span class="key-badge">1</span> In 2 Hours</button>
            <button class="btn btn-choice" data-hours="4"><span class="key-badge">2</span> In 4 Hours</button>
            <button class="btn btn-choice" data-hours="24"><span class="key-badge">3</span> Tomorrow</button>
            <button class="btn btn-choice" data-hours="48"><span class="key-badge">4</span> In 2 Days</button>
            <button class="btn btn-choice" data-hours="168"><span class="key-badge">5</span> Next Week</button>
          </div>
          <div class="form-group mt-2">
            <label for="customCallbackInput">Or pick custom date &amp; time:</label>
            <input type="datetime-local" id="customCallbackInput" class="chunky-input">
          </div>
          <div class="sheet-foot flex-row mt-2">
            <button id="btnCancelCallback" class="btn btn-subtle btn-block"><span class="key-badge">0</span> Cancel</button>
            <button id="btnConfirmCallbackSchedule" class="btn btn-gold btn-block">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Email Launch Sheet -->
    <div id="modalEmailPicker" class="modal-sheet-backdrop hidden">
      <div class="modal-sheet">
        <div class="sheet-head">
          <h3>Send Rapid Email</h3>
          <button id="btnCloseEmailSheet" class="btn-clear">&times;</button>
        </div>
        <div class="sheet-body">
          <div class="form-group">
            <label for="pickerTemplateSelect">Template</label>
            <select id="pickerTemplateSelect" class="chunky-input"></select>
          </div>
          <div class="form-group">
            <label for="draftSubject">Subject</label>
            <input type="text" id="draftSubject" class="chunky-input">
          </div>
          <div class="form-group">
            <label for="draftBody">Message</label>
            <textarea id="draftBody" class="chunky-input" rows="4"></textarea>
          </div>
          <div class="btn-grid-2">
            <button id="btnLaunchMailtoApp" class="btn btn-gold btn-block"><span class="key-badge">1</span> Open Mail App</button>
            <button id="btnLaunchWebGmail" class="btn btn-subtle btn-block"><span class="key-badge">2</span> Gmail Web</button>
          </div>
          <div class="btn-grid-2 mt-2">
            <button id="btnCancelEmail" class="btn btn-subtle btn-block"><span class="key-badge">0</span> Cancel</button>
            <button id="btnMarkEmailLogged" class="btn btn-emerald btn-block"><span class="key-badge">3</span> Log Sent</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Contact Modal -->
    <div id="modalEditContact" class="modal-sheet-backdrop hidden">
      <div class="modal-sheet">
        <div class="sheet-head">
          <h3 id="editModalHeading">Edit Contact</h3>
          <button id="btnCloseEditSheet" class="btn-clear">&times;</button>
        </div>
        <form id="formEditContact" class="sheet-body">
          <input type="hidden" id="editContactId">
          <div class="form-group">
            <label for="editCompany">Business / Company Name</label>
            <input type="text" id="editCompany" class="chunky-input" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="editName">Contact Full Name</label>
            <input type="text" id="editName" class="chunky-input" autocomplete="off">
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label for="editPhone">Phone</label>
              <input type="tel" id="editPhone" class="chunky-input" autocomplete="off">
            </div>
            <div class="form-group">
              <label for="editEmail">Email</label>
              <input type="email" id="editEmail" class="chunky-input" autocomplete="off">
            </div>
          </div>
          <div class="form-group">
            <label for="editJobTitle">Role / Title</label>
            <input type="text" id="editJobTitle" class="chunky-input" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="editNotes">Notes</label>
            <textarea id="editNotes" class="chunky-input" rows="2"></textarea>
          </div>
          <div class="sheet-foot flex-row">
            <button type="button" id="btnCancelEdit" class="btn btn-subtle btn-block"><span class="key-badge">0</span> Cancel</button>
            <button type="submit" class="btn btn-gold btn-block">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- ================= TEMPLATES ================= -->

  <!-- 1. BENTO CONTACT CARD -->
  <template id="tmpl-contact-card">
    <div class="bento-card" role="listitem" tabindex="0">
      <div class="bento-avatar"></div>
      <div class="bento-info">
        <div class="bento-header-primary"></div>
        <div class="bento-sub-person"></div>
        <div class="bento-direct-phone"></div>
      </div>
      <div class="bento-action-badge">
        <span class="status-tag"></span>
        <span class="open-cue">↵ Open</span>
      </div>
    </div>
  </template>

  <!-- 2. COCKPIT (CALL & EMAIL COMMAND CENTER) -->
  <template id="tmpl-cockpit">
    <div class="cockpit-layout">
      
      <!-- Contact Hero (Business Name as Primary Header) -->
      <div class="cockpit-hero">
        <div class="hero-avatar"></div>
        <div class="hero-details">
          <h1 class="hero-business-title"></h1>
          <div class="hero-person-row"></div>
          <div class="hero-phone-row"></div>
          <div class="hero-email-row"></div>
        </div>
      </div>

      <!-- DUAL-ACTION LAUNCHPAD: CALL & EMAIL -->
      <div class="cockpit-dual-triggers">
        <a id="btnCockpitCall" href="#" class="chunky-action-tile tile-call">
          <div class="tile-icon">📞</div>
          <div class="tile-content">
            <div class="tile-key-badge"><span class="key-badge-lg">1</span> CALL</div>
            <div class="tile-sub">Voice Dial</div>
          </div>
        </a>

        <button id="btnCockpitEmail" class="chunky-action-tile tile-email">
          <div class="tile-icon">✉️</div>
          <div class="tile-content">
            <div class="tile-key-badge"><span class="key-badge-lg">2</span> EMAIL</div>
            <div class="tile-sub">Send Template</div>
          </div>
        </button>
      </div>

      <!-- 4-WAY INSTANT DISPOSITION GRID (KEYS 3, 4, 5, 7) -->
      <div class="disposition-container">
        <div class="disposition-header">
          <span>DISPOSITION (GRADUATES CONTACT OUT)</span>
        </div>
        <div class="disposition-grid">
          <!-- Key 3: No Answer -->
          <button id="btnDispNoAnswer" class="disp-btn disp-no-answer">
            <span class="disp-key">3</span>
            <span class="disp-icon">🔕</span>
            <span class="disp-title">NO ANSWER</span>
            <span class="disp-desc">Stay in Fresh</span>
          </button>

          <!-- Key 4: Call Back -->
          <button id="btnDispCallBack" class="disp-btn disp-callback">
            <span class="disp-key">4</span>
            <span class="disp-icon">📅</span>
            <span class="disp-title">CALL BACK</span>
            <span class="disp-desc">Schedule</span>
          </button>

          <!-- Key 5: Contacted -->
          <button id="btnDispContacted" class="disp-btn disp-contacted">
            <span class="disp-key">5</span>
            <span class="disp-icon">⭐</span>
            <span class="disp-title">CONTACTED</span>
            <span class="disp-desc">Done / Closed</span>
          </button>

          <!-- Key 7: DNC -->
          <button id="btnDispDNC" class="disp-btn disp-dnc">
            <span class="disp-key">7</span>
            <span class="disp-icon">🚫</span>
            <span class="disp-title">D.N.C.</span>
            <span class="disp-desc">Purge / Scrub</span>
          </button>
        </div>
      </div>

      <!-- Notes Bento (Hidden completely if blank) -->
      <div id="cockpitNotesBox" class="bento-box mt-2">
        <div class="box-head-row">
          <span class="box-caption">NOTES</span>
          <button id="btnQuickEditNotes" class="btn-micro"><span class="key-badge">6</span> Edit</button>
        </div>
        <p class="cockpit-notes-text"></p>
      </div>

      <!-- Activity History -->
      <div id="cockpitHistoryBox" class="bento-box mt-2">
        <div class="box-head-row">
          <span class="box-caption">ACTIVITY HISTORY</span>
          <span class="cockpit-log-count"></span>
        </div>
        <div class="cockpit-history-feed"></div>
      </div>

    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
